version: '3.8'

services:
  skillf:
    build: .
    container_name: skillf
    ports:
      - "8080:8080"
    volumes:
      - skillf_data:/data
    environment:
      - SKILLF_PORT=8080
      - SKILLF_DB=/data/skillf.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  skillf_data:
    driver: local
