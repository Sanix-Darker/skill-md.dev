{{define "convert.html"}}
<div class="page-shell page-shell--dense stack-xl">
    <section class="section-heading">
        <p class="eyebrow">Import</p>
        <h1 class="section-title">Convert a source into a skill.</h1>
        <p class="section-copy">Pick a type. Import one input.</p>
    </section>

    <div class="workspace">
        <section class="panel">
            <form hx-post="/api/convert" hx-encoding="multipart/form-data" hx-target="#convert-result" hx-swap="innerHTML" class="form-stack">
                <div class="form-grid-2">
                    <div class="field">
                        <div class="field-head">
                            <label for="convert-format">Source type</label>
                            <span class="tooltip hint-chip" tabindex="0" data-tooltip="Force the parser when auto detect is not enough." aria-label="Source type help">?</span>
                        </div>
                        <select id="convert-format" name="format">
                            <option value="auto">Auto detect</option>
                            <option value="openapi">OpenAPI / Swagger</option>
                            <option value="postman">Postman collection</option>
                            <option value="asyncapi">AsyncAPI</option>
                            <option value="graphql">GraphQL schema</option>
                            <option value="protobuf">Protobuf / gRPC</option>
                            <option value="raml">RAML</option>
                            <option value="wsdl">WSDL / SOAP</option>
                            <option value="apiblueprint">API Blueprint</option>
                            <option value="pdf">PDF</option>
                            <option value="plaintext">Plain text / notes</option>
                            <option value="url">Remote URL</option>
                        </select>
                    </div>
                    <div class="field">
                        <div class="field-head">
                            <label for="convert-name">Skill name</label>
                            <span class="tooltip hint-chip" tabindex="0" data-tooltip="Optional override for the generated name." aria-label="Skill name help">?</span>
                        </div>
                        <input id="convert-name" name="name" type="text" placeholder="Customer API skill">
                    </div>
                </div>

                <div class="fieldset">
                    <p class="fieldset-title">Input</p>
                    <div class="field">
                        <div class="field-head">
                            <label for="convert-url">Public link</label>
                            <span class="tooltip hint-chip" tabindex="0" data-tooltip="Use this for public docs, exported files, or an existing remote skill source." aria-label="Public link help">?</span>
                        </div>
                        <input id="convert-url" name="url" type="url" placeholder="https://example.com/openapi.json">
                    </div>
                    <div class="field">
                        <div class="field-head">
                            <label for="convert-file">Local file</label>
                            <span class="tooltip hint-chip" tabindex="0" data-tooltip="Best for specs, collections, PDFs, schemas, or notes already on disk." aria-label="Local file help">?</span>
                        </div>
                        <input id="convert-file" name="file" type="file">
                    </div>
                    <div class="field">
                        <div class="field-head">
                            <label for="convert-content">Raw content</label>
                            <span class="tooltip hint-chip" tabindex="0" data-tooltip="Paste source material directly. If the content is a URL, the backend treats it as a link import." aria-label="Raw content help">?</span>
                        </div>
                        <textarea id="convert-content" name="content" placeholder="Paste source material here"></textarea>
                    </div>
                </div>

                <div class="actions">
                    <button type="submit" class="btn btn--primary">Convert to a skill</button>
                    <span class="inline-note tooltip" tabindex="0" data-tooltip="Leave the unused fields empty. The first valid input wins.">One input only.</span>
                </div>
            </form>
        </section>

        <aside class="panel panel--soft stack-sm">
            <p class="eyebrow">Flow</p>
            <ul class="protocol-list">
                <li>
                    <strong>1</strong> Pick the type.
                </li>
                <li>
                    <strong>2</strong> Use one input.
                </li>
                <li>
                    <strong>3</strong> Merge later if needed.
                </li>
            </ul>
        </aside>
    </div>

    <section>
        <div class="section-heading">
            <p class="eyebrow">Result</p>
            <h2 class="section-title">Generated skill</h2>
        </div>
        <div id="convert-result" class="result-shell preview-shell">
            <p class="helper">Output appears here.</p>
        </div>
    </section>
</div>

<script>
function downloadOutput() {
    const code = document.querySelector('#convert-result pre code');
    if (!code) {
        return;
    }

    const blob = new Blob([code.textContent || ''], { type: 'text/markdown;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'SKILL.md';
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
}
</script>
{{end}}
