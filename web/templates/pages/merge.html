{{define "merge.html"}}
<div class="page-shell page-shell--dense stack-xl">
    <section class="section-heading">
        <p class="eyebrow">Merge</p>
        <h1 class="section-title">Combine clean skills.</h1>
    </section>

    <div class="workspace workspace--paired">
        <section class="panel">
            <form hx-post="/api/merge" hx-encoding="multipart/form-data" hx-target="#merge-result" hx-swap="innerHTML" class="form-stack">
                <div class="field">
                    <div class="field-head">
                        <label for="merge-files">Skill files</label>
                        <span class="tooltip hint-chip" tabindex="0" data-tooltip="Select at least two existing skill files." aria-label="Skill files help">?</span>
                    </div>
                    <input id="merge-files" name="files" type="file" multiple required>
                </div>

                <div class="info-grid">
                    <div class="field">
                        <div class="field-head">
                            <label for="merge-name">Merged name</label>
                            <span class="tooltip hint-chip" tabindex="0" data-tooltip="Optional override for the merged skill name." aria-label="Merged name help">?</span>
                        </div>
                        <input id="merge-name" name="name" type="text" placeholder="Combined workflow">
                    </div>
                    <div class="field">
                        <div class="field-head">
                            <label for="merge-strategy">Conflict strategy</label>
                            <span class="tooltip hint-chip" tabindex="0" data-tooltip="Choose how conflicting frontmatter and section values should resolve." aria-label="Conflict strategy help">?</span>
                        </div>
                        <select id="merge-strategy" name="strategy">
                            <option value="keep_first">keep_first (safe default)</option>
                            <option value="keep_last">keep_last</option>
                            <option value="keep_longer">keep_longer</option>
                            <option value="combine">combine</option>
                        </select>
                    </div>
                </div>

                <div class="field">
                    <div class="field-head">
                        <label for="merge-description">Description override</label>
                        <span class="tooltip hint-chip" tabindex="0" data-tooltip="Optional replacement description for the merged output." aria-label="Description override help">?</span>
                    </div>
                    <textarea id="merge-description" name="description" placeholder="Optional merged description"></textarea>
                </div>

                <label class="checkbox-row tooltip" tabindex="0" data-tooltip="Remove repeated sections before conflict resolution.">
                    <input type="checkbox" name="dedupe" value="true">
                    <span>Deduplicate repeats.</span>
                </label>

                <div class="actions">
                    <button type="submit" class="btn btn--primary">Merge skills</button>
                </div>
            </form>
        </section>

        <section class="panel result-panel">
            <div class="section-heading">
                <p class="eyebrow">Result</p>
                <h2 class="section-title">Output</h2>
            </div>
            <div id="merge-result" class="result-shell preview-shell">
                <p class="helper">Waiting.</p>
            </div>
        </section>
    </div>
</div>

<script>
function downloadOutput() {
    const code = document.querySelector('#merge-result pre code');
    if (!code) {
        return;
    }

    const blob = new Blob([code.textContent || ''], { type: 'text/markdown;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'SKILL.md';
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
}
</script>
{{end}}
